server {
    listen 80;
    server_name localhost;

    # 1. Servir los archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirigir peticiones del Backend de Ventas (Puerto 8080 de la EC2 Privada)
    location /api/ventas/ {
       proxy_pass http://10.0.142.124:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Redirigir peticiones del Backend de Despachos (Puerto 8081 de la EC2 Privada)
    location /api/despachos/ {
        proxy_pass http://10.0.142.124:8081/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}