name: CI/CD Pipeline - Innovatech Chile

on:
  push:
    branches:
      - main

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- CONFIGURACIÓN DE LA LLAVE SSH EN EL ENTORNO LINUX ---
      - name: Configurar Agente SSH Nativo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null\n" > ~/.ssh/config

      # --- ETAPA 1: INSTALACIÓN DE DEPENDENCIAS EN EL FRONT ---
      - name: Instalar Git y Docker en Frontend si faltan
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} '
            if ! command -v git &> /dev/null; then
              echo "Instalando Git..."
              sudo dnf install -y git
            fi
            
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker..."
              sudo dnf install -y docker
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
              sudo chmod 666 /var/run/docker.sock
            fi
          '

      # --- ETAPA 2: DESPLIEGUE EN EL FRONTEND ---
      - name: Desplegar Frontend vía SSH Puro
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} '
            mkdir -p ~/Devops-prueba2
            cd ~/Devops-prueba2
            
            if [ ! -d ".git" ]; then
              git clone https://github.com/RamiroGomeztxt/Devops-prueba2.git .
            else
              git reset --hard HEAD
              git pull origin main
            fi
            
            cd front_despacho
            docker build -t frontend-app .
            docker stop frontend-container || true
            docker rm frontend-container || true
            docker run -d -p 80:80 --name frontend-container frontend-app
          '

      # --- ETAPA 3: TRANSFERIR ARCHIVOS Y DESPLEGAR BACKEND PRIVADO ---
      - name: Transferir archivos y Desplegar Backend Privado
        run: |
          # 1. Crear la llave temporal en el Front
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} "echo '${{ secrets.SSH_PRIVATE_KEY }}' > ~/key_temporal.pem && chmod 600 ~/key_temporal.pem"
          
          # 2. Asegurar que el Backend tenga Docker, Docker Compose y Buildx perfectamente mapeados
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} "
            ssh -i ~/key_temporal.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }} '
              if ! command -v docker &> /dev/null; then
                echo \"Instalando Docker en el Backend...\"
                sudo dnf install -y docker
                sudo systemctl start docker
                sudo systemctl enable docker
                sudo usermod -aG docker \$USER
                sudo chmod 666 /var/run/docker.sock
              fi

              # Instalar Buildx en la ruta del usuario local para asegurar detección por SSH
              if [ ! -f \"\$HOME/.docker/cli-plugins/docker-buildx\" ]; then
                echo \"Configurando Docker Buildx en el entorno del usuario...\"
                mkdir -p \$HOME/.docker/cli-plugins
                curl -L \"https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-x86_64\" -o \$HOME/.docker/cli-plugins/docker-buildx
                chmod +x \$HOME/.docker/cli-plugins/docker-buildx
              fi

              # Mantener la ruta global por compatibilidad del sistema
              if [ ! -f \"/usr/libexec/docker/cli-plugins/docker-buildx\" ]; then
                sudo mkdir -p /usr/libexec/docker/cli-plugins
                sudo cp \$HOME/.docker/cli-plugins/docker-buildx /usr/libexec/docker/cli-plugins/docker-buildx
                sudo chmod +x /usr/libexec/docker/cli-plugins/docker-buildx
              fi

              if ! command -v docker-compose &> /dev/null; then
                echo \"Instalando Docker Compose en el Backend...\"
                sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
                sudo chmod +x /usr/local/bin/docker-compose
                sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
              fi

              # Inicializar el builder de Buildx para dejar el motor activo
              docker buildx create --use --name mi_constructor || true
            '
          "

          # 3. Crear el directorio de la app y transferir los archivos de Spring Boot
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} "
            cd ~/Devops-prueba2
            ssh -i ~/key_temporal.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }} 'mkdir -p ~/app-backend'
            scp -i ~/key_temporal.pem -o StrictHostKeyChecking=no -r docker-compose.yml back-Despachos_SpringBoot back-Ventas_SpringBoot ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }}:~/app-backend/
          "
          
          # 4. Compilar y levantar los contenedores en el Backend
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} "
            ssh -i ~/key_temporal.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACK_PRIVATE_IP }} '
              cd ~/app-backend
              docker-compose down || true
              docker-compose up -d --build
            '
          "
          
          # 5. Limpieza de seguridad de la llave temporal
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONT_IP }} "rm -f ~/key_temporal.pem"